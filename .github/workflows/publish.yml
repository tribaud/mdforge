name: Publish

# Publishes on a version tag. The tag is the single source of truth:
#   v0.2.0          → stable release to the Marketplace + Open VSX
#   v0.2.0-beta.1   → pre-release to the Marketplace only (opt-in beta channel)
# A tag with a "-suffix" is treated as a pre-release; the numeric version is
# the part before the dash. Requires secrets:
#   VSCE_PAT — Azure DevOps PAT with "Marketplace > Manage" scope
#   OVSX_PAT — Open VSX access token (optional; step skipped when unset)
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      PRERELEASE: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set version from tag
        run: |
          RAW="${GITHUB_REF_NAME#v}"        # 0.2.0 or 0.2.0-beta.1
          VERSION="${RAW%%-*}"              # 0.2.0
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$RAW" != "$VERSION" ]; then
            echo "PRERELEASE=--pre-release" >> "$GITHUB_ENV"
            echo "Publishing PRE-RELEASE $VERSION (from tag $GITHUB_REF_NAME)"
          else
            echo "Publishing RELEASE $VERSION (from tag $GITHUB_REF_NAME)"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - run: npx tsc -p media-src --noEmit

      - name: Package
        run: npx @vscode/vsce package $PRERELEASE --out mdforge.vsix

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish $PRERELEASE --packagePath mdforge.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Stable only: Open VSX has no opt-in pre-release channel, so betas would
      # reach everyone. continue-on-error tolerates an already-published version.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' && env.PRERELEASE == '' }}
        continue-on-error: true
        run: npx ovsx publish mdforge.vsix -p "$OVSX_PAT"
