<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Icone barre de titre MDForge — variante dark.
       VS Code rend les SVG contribues comme des images : currentColor n'herite
       de rien et retombe sur du noir. La couleur doit donc etre explicite, et
       une variante par theme declaree dans package.json (icon.light / icon.dark).
       Regenerer les deux variantes ensemble : voir scripts/make-icons.sh -->
  <text x="12" y="10.5" text-anchor="middle" fill="#C5C5C5"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-weight="800">md</text>
  <!-- marteau horizontal : tete evidee a gauche, manche plein a droite -->
  <rect x="3.2" y="13.2" width="5.6" height="7.6" rx="0.6"
        fill="none" stroke="#C5C5C5" stroke-width="1.4"/>
  <path d="M 9 15.5 H 20 A 1.5 1.5 0 0 1 20 18.5 H 9 Z" fill="#C5C5C5"/>
</svg>
